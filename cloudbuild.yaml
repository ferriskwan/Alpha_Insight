steps:
  # 1. Build Web Application Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.web'
      - '-t'
      - 'gcr.io/$PROJECT_ID/alpha-insight-web:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/alpha-insight-web:latest'
      - '.'

  # 2. Build Daily Batch Pipeline Job Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.job'
      - '-t'
      - 'gcr.io/$PROJECT_ID/alpha-insight-job:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/alpha-insight-job:latest'
      - '.'

  # 3. Push Docker Images to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/alpha-insight-web:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/alpha-insight-web:latest']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/alpha-insight-job:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/alpha-insight-job:latest']

  # 4. Deploy Web Service to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'alpha-insight-web'
      - '--image'
      - 'gcr.io/$PROJECT_ID/alpha-insight-web:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

  # 5. Update Cloud Run Job Definition
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'alpha-insight-daily-job'
      - '--image'
      - 'gcr.io/$PROJECT_ID/alpha-insight-job:$COMMIT_SHA'
      - '--region'
      - 'us-central1'

images:
  - 'gcr.io/$PROJECT_ID/alpha-insight-web:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/alpha-insight-web:latest'
  - 'gcr.io/$PROJECT_ID/alpha-insight-job:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/alpha-insight-job:latest'

options:
  logging: CLOUD_LOGGING_ONLY
